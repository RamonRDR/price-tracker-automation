name: One-time formatting for feature branch

on:
  push:
    branches:
      - feat/price-tracker-complete-mvp

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'RamonRDR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Ruff
        run: python -m pip install "ruff>=0.14,<1"
      - name: Apply safe Ruff fixes and formatting to feature branch only
        run: |
          ruff check --fix . || true
          ruff format .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff fixes and consistent formatting"
            git push origin HEAD:feat/price-tracker-complete-mvp
          fi
