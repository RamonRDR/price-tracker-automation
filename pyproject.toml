[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "price-tracker-automation"
version = "0.1.0"
description = "A responsible, testable price monitoring CLI built with Python, Playwright and SQLite."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Ramon Rodriguez" }]
keywords = ["python", "playwright", "automation", "price-tracker", "cli"]
dependencies = [
  "httpx>=0.28,<1",
  "playwright>=1.56,<2",
  "pydantic>=2.12,<3",
  "rich>=14,<16",
  "SQLAlchemy>=2.0.40,<3",
  "typer>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<10",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.14,<1",
]

[project.scripts]
price-tracker = "price_tracker.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/price_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: exercises a controlled local HTML page through Chromium"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]
